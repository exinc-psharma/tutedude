<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Best Sneakers around! Thala for a reason.">
    <title>Thala Mini Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <a href="index.html">Thala <span>7.</span></a>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#brands">
                        Brands <i class="fa-solid fa-chevron-down"></i> 
                        </a>
                    </li>
                    <li><a href="#more">
                        More <i class="fa-solid fa-chevron-down"></i> 
                        </a>
                    </li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <div class="user">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="text"
                            placeholder="Search">
                    </div>
                    <a href="shop.html" class="cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>0</span>
                    </a>
                    <div class="profile">
                        <img src="images/profile.png" alt="Profile Picture">
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <div class="left">
                    <div class="image">
                        <img src="images/sevenlogo.png" alt="logo">
                        <h2>7!! Thala For a <span>Reason!</span></h2>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas eius sed repellendus modi quas iste.</p>
                        <a href="product.html">Shop Now</a>
                    </div>
                </div>
                <div class="right">
                    <img src="images/sneaker.png" alt="sneaker">
                    <div class="badge">
                        <img src="images/alogo.png" alt="A logo">
                    </div>
                </div>
            </div>
            <div class="hero-footer">
                <div class="stat">
                    <i class="fa-regular fa-comment-dots"></i>
                    <div>
                        <h3>2k+</h3>
                        <p>Reviews</p>
                    </div>
                </div>
                <div class="stat">
                    <i class="fa-solid fa-users"></i>
                    <div>
                        <h3>30k+</h3>
                        <p>Customers</p>
                    </div>
                </div>
                <div class="stat">
                    <i class="fa-regular fa-star"></i>
                    <div>
                        <h3>High</h3>
                        <p>Quality</p>
                    </div>
                </div>
                <div class="stat">
                    <i class="fa-regular fa-star"></i>
                    <div>
                        <h3>4.5/5</h3>
                        <p>Rating</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
