<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="download-removebg-preview.png" alt="Laundry">
        </div>
        <div class="right">
            <div class="login-box">
            <h1>Hello Again!</h1>
            <p id="p1">Welcome back! we missed you!</p>
            <form action="#">
                <label for="email">Email</label>
                <input id="email"type="email" required placeholder="xyz@mail.com">
                <label for="pass">Password</label>
                <input id="pass"type="password" required placeholder="Password">
                <p id="p2">Forgot Password</p>
                <button>Login</button>
            </form>
            <p>Not a member? <span><strong>Register Now</strong></span></p>
            </div>
        </div>
    </div>

</body>
</html>
